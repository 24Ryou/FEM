<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>

  <div class="container-social">
    <div class="avatar-box">
      <img class="avatar-img" src="./assets/images/avatar-jessica.jpeg" alt="profile-photo">
      <div class="avatar-text">
        <h1 class="avatar-headline">
          Jessica Randall
        </h1>
        <p class="avatar-location">
          London, United Kingdom
        </p>
      </div>
      <p class="avatar-about">
        "Front-end developer and avid reader."
      </p>
    </div>
    <div class="box-links">
      <ul class="links-list">
        <li class="link-item">
          <a href="">Github</a>
        </li>
        <li class="link-item"><a href="">Frontend Mentor</a></li>
        <li class="link-item"><a href="">Linkedin</a></li>
        <li class="link-item"><a href="">Twitter</a></li>
        <li class="link-item"><a href="">Instagram</a></li>
      </ul>
    </div>
  </div>

</body>

</html>
