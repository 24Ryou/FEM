<div class="card">
  <h2>{{title}}</h2>

  <p>{{description}}</p>

  <div class="tags">
    {{#each tags}}
      <span class="tag">{{this}}</span>
    {{/each}}
  </div>

  <div class="links">
    <a href="{{folder}}" target="_blank">Live</a>
    <a href="{{orginalLink}}" target="_blank">Challenge</a>
  </div>

  <span class="level level-{{level}}">
    {{level}}
  </span>
</div>
